# Tinfoil Container configuration for the Melong Matrix chatbot.
# Full reference: https://docs.tinfoil.sh/containers/configuration
#
# This file is PUBLIC and measured into the enclave attestation. Never put
# secret values here; they go in the Tinfoil dashboard under Secrets.
#
# Before the first release, replace OWNER/REPO below with this repo's GitHub
# path (e.g. ghcr.io/my-org/melong_matrix). The "Tinfoil Release" workflow
# builds the image and rewrites the @sha256 digest on every release.

cvm-version: 0.14.12
cpus: 2
# 16 GB: the speech sidecar uses ~3 GB at runtime, the bot ~0.5 GB, and the
# container images themselves may be held in memory inside the enclave.
memory: 16384

networks:
  # Outbound access is blocked by default. Allow only what the bot needs.
  egress:
    egress: allowlist
    allow:
      - wick.keanu.im             # Matrix homeserver (must match MATRIX_HOMESERVER_URL)
      - inference.tinfoil.sh      # Tinfoil inference API
      # inference.tinfoil.sh is a CNAME chain ending here; listed explicitly in
      # case the egress firewall doesn't follow CNAMEs.
      - inference.tinfoil.containers.tinfoil.dev
      - atc.tinfoil.sh            # Tinfoil attestation verification
      - github-proxy.tinfoil.sh   # attestation fallbacks used by the Tinfoil SDK
      - kds-proxy.tinfoil.sh
  # Bot <-> speech sidecar only. No internet access.
  internal: {}

containers:
  - name: "melong-bot"
    image: "ghcr.io/n8fr8/tinfoil_matrix_chat@sha256:ab3dae7bba696cf6d3bade523ce91a5fc409583c95d4d984d1f01410fa1bba2f" # v0.2.4
    restart: always
    # Run as root inside the sandbox: Tinfoil mounts the tmpfs paths below owned
    # by root, so the image's unprivileged "node" user can't write to them. The
    # container still has no Linux capabilities, a read-only root filesystem,
    # and no-new-privileges.
    user: "0:0"
    networks: [egress, internal]
    # Root filesystem is read-only; runtime state goes in memory and is wiped on
    # restart. Each start therefore logs in with the password as a new Matrix
    # device and removes the previous one (MATRIX_CLEANUP_OLD_DEVICES).
    tmpfs:
      /app/data: "size=256m"
      /tmp: "size=64m"
    env:
      - MATRIX_HOMESERVER_URL: "https://wick.keanu.im"
      - MATRIX_CLEANUP_OLD_DEVICES: "true"
      - MATRIX_DEVICE_NAME: "melong-bot"
      - MATRIX_ENCRYPTION: "true"
      - MATRIX_AUTOJOIN: "true"
      - MATRIX_LOG_LEVEL: "INFO"
      - TINFOIL_MODEL: "gemma4-31b"
      - TINFOIL_TTS_MODEL: "voxtral-tts"
      - TINFOIL_TTS_VOICE: "neutral_female"
      - HEALTH_PORT: "8080"
      - SPEECH_URL: "http://speech:8000"
      - SPEECH_STT: "tibetan"
      # Values for these bare names are set per instance when deploying.
      - MATRIX_USERNAME
      - MATRIX_DISPLAY_NAME
      - MATRIX_COMMAND_PREFIX
    secrets:
      - TINFOIL_API_KEY
      - MATRIX_PASSWORD
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 2m

  # Tibetan speech sidecar: MMS text-to-speech + speech-to-text on CPU.
  # Weights are baked into the image (pinned revisions; models are CC-BY-NC 4.0).
  - name: "speech"
    image: "ghcr.io/n8fr8/tinfoil_matrix_chat-speech@sha256:a8ac82bd8a1a118bceb8f781dcf7bc44e1617f80b87cabae7f6e8c5c60ebf8ef" # v0.2.4
    restart: always
    networks: [internal]
    tmpfs:
      /tmp: "size=256m"
    env:
      - ORT_THREADS: "2"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5m

# Public HTTPS entry point: serves the bot's status JSON (no sensitive data).
shim:
  upstream-port: 8080
  paths:
    - /*
